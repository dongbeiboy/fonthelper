name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build (${{ matrix.mode.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode:
          - name: full   # 含 .NET 运行时
            self_contained: 'true'
            out: publish
            setup_mode: full
            setup_suffix: ''
          - name: nofx   # 不含 .NET 运行时
            self_contained: 'false'
            out: publish-fd
            setup_mode: nofx
            setup_suffix: '-nofx'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Update version from tag
        run: |
          $version = "${{ github.ref_name }}" -replace "^v", ""
          $csproj = "src/TOfont.WinUI/TOfont.WinUI.csproj"
          (Get-Content $csproj) -replace '<Version>.*</Version>', "<Version>$version</Version>" | Set-Content $csproj
          echo "Version updated to: $version"

      - name: Publish
        run: dotnet publish src/TOfont.WinUI/TOfont.WinUI.csproj -c Release -r win-x64 --self-contained ${{ matrix.mode.self_contained }} -p:DebugType=None -p:DebugSymbols=false -o ${{ matrix.mode.out }}

      - name: Clean unnecessary files
        run: |
          Remove-Item -Path ${{ matrix.mode.out }}/*.pdb -Force -ErrorAction SilentlyContinue
          if ("${{ matrix.mode.self_contained }}" -eq "true") {
            # 自包含不需要 deps/runtimeconfig，framework-dependent 必须保留
            Remove-Item -Path ${{ matrix.mode.out }}/*.deps.json -Force -ErrorAction SilentlyContinue
            Remove-Item -Path ${{ matrix.mode.out }}/*.runtimeconfig.json -Force -ErrorAction SilentlyContinue
          }

      - name: Build installer with Inno Setup
        run: |
          $version = "${{ github.ref_name }}" -replace "^v", ""
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "installer/installer.iss" /DMyAppVersion=$version /DBuildMode=${{ matrix.mode.setup_mode }} /O"$env:GITHUB_WORKSPACE"
          Get-ChildItem TOfont-setup*.exe | Select-Object Name, Length

      - name: Pack green zip (仅含框架版)
        if: matrix.mode.name == 'full'
        run: |
          mkdir TOfont
          Move-Item -Path publish/* -Destination TOfont/
          Compress-Archive -Path TOfont -DestinationPath TOfont-win-x64.zip -CompressionLevel Optimal

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.mode.name }}
          path: |
            TOfont-setup${{ matrix.mode.setup_suffix }}-*.exe
            TOfont-win-x64.zip
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: Get-ChildItem artifacts | Select-Object Name, @{n='MB';e={[Math]::Round($_.Length/1MB,1)}}

      - name: Get changelog
        id: changelog
        run: |
          $prevTag = git describe --tags --abbrev=0 HEAD^ 2>$null
          if ($prevTag) {
            $log = git log "$prevTag..HEAD" --pretty=format:"- %s" --no-merges
          } else {
            $log = git log --pretty=format:"- %s" --no-merges -10
          }
          $log | Out-File -FilePath changelog.md -Encoding utf8
          echo "changelog<<EOF" >> $env:GITHUB_OUTPUT
          Get-Content changelog.md >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          body: ${{ steps.changelog.outputs.changelog }}
